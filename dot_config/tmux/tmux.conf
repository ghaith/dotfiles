# ─── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix          # C-a C-a → send literal C-a (nested tmux / shell)

# ─── Terminal & Mouse ────────────────────────────────────────────────────────
set -g mouse on
# Fast ESC for vim, but not so fast that escape sequences split by SSH/conpty
# jitter get misparsed: replies to tmux's attach-time terminal queries arrive
# from Windows Terminal in fragments; below ~50ms tmux gives up mid-sequence
# and injects the tail as literal keystrokes into the active pane.
set -g escape-time 50
set -g extended-keys on
if-shell 'tmux -V | awk "{if (\$2+0 >= 3.5) exit 0; else exit 1}"' \
    'set -g extended-keys-format csi-u'
set -g focus-events on
set-option -g status-keys emacs
set-option -g allow-rename off
set-option -g allow-passthrough on

# Clipboard: all copy paths go through `tmux load-buffer -w` (yank.sh, nvim),
# which forwards via OSC 52 to whichever client is attached right now.
set-option -g set-clipboard on
set -as terminal-features 'xterm*:clipboard'
set -as terminal-features 'tmux*:clipboard'

# tmux snapshots the environment at server start; refresh these on (re)attach
# so new panes and jobs see the current client's reality. The default list
# has DISPLAY but predates Wayland and misses SSH_TTY.
set -ga update-environment 'WAYLAND_DISPLAY'
set -ga update-environment 'SSH_TTY'

# Windows Terminal quirk: on attach, both conpty and WT answer tmux's Device
# Attributes queries. tmux consumes the first pair and forwards the duplicate
# pair to the active pane as typed input ("garbage on attach"). Declare the
# duplicates as user-keys bound to a no-op so they are discarded instead.
# If WT changes its DA1 feature list in an update, refresh user-keys[0] with
# the bytes captured via `cat -v`.
set -s user-keys[0] "\e[?61;4;6;7;14;21;22;23;24;28;32;42c"
set -s user-keys[1] "\e[>0;10;1c"
bind -n User0 send-keys ''
bind -n User1 send-keys ''

# COLORTERM makes nvim (0.10+) skip its truecolor probing (XTGETTCAP/DECRQSS
# wrapped in passthrough to the host terminal). Windows Terminal's DCS replies
# to those probes are not parseable by tmux 3.4 and get injected into the
# active pane as typed input — SGR-tail garbage like "…50m", with the leading
# ESC cancelling tasks in TUIs. All terminals in use are truecolor anyway.
set-environment -g COLORTERM truecolor

# ─── Panes ───────────────────────────────────────────────────────────────────
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Navigate panes — Alt+hjkl (no prefix needed)
# j=down, k=up matches vim convention
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# Resize panes — prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Zoom current pane (toggle)
bind z resize-pane -Z

# Kill with confirmation — x = pane, X = whole window (useful for hung processes)
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# ─── Windows ─────────────────────────────────────────────────────────────────
bind c new-window -c '#{pane_current_path}'
bind n next-window
bind p previous-window
bind b break-pane -d
bind , command-prompt -I "#{window_name}" "rename-window '%%'"
bind '$' command-prompt -I "#{session_name}" "rename-session '%%'"

# ─── Layouts ─────────────────────────────────────────────────────────────────
bind -r Space next-layout         # cycle through: even-h, even-v, main-h, main-v, tiled
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ─── Copy mode (vi) ──────────────────────────────────────────────────────────
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer

unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi V     send-keys -X select-line
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle

# All copy paths go through yank.sh for consistent clipboard behaviour
bind-key -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "~/.config/tmux/yank.sh"
bind-key -T copy-mode-vi Enter \
    send-keys -X copy-pipe-and-cancel "~/.config/tmux/yank.sh"
bind-key -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "~/.config/tmux/yank.sh"

# ─── Session ─────────────────────────────────────────────────────────────────
bind d detach-client
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"

# ─── Which-key popup (prefix + Tab) ──────────────────────────────────────────
# Shows a menu of all key bindings. Press the key shown to execute immediately.
# Arrow keys / Enter also work. Escape to cancel.
bind Tab display-menu -T "  tmux keys " -x C -y C \
    "Panes" "" "" \
    "  Split Right            |" "|" "split-window -h -c '#{pane_current_path}'" \
    "  Split Down             -" "-" "split-window -v -c '#{pane_current_path}'" \
    "  Zoom Toggle            z" "z" "resize-pane -Z" \
    "  Kill Pane              x" "x" "confirm-before -p 'kill pane? (y/n)' kill-pane" \
    "  Kill Window            X" "X" "confirm-before -p 'kill window? (y/n)' kill-window" \
    "  Navigate         Alt+h/j/k/l" "" "" \
    "  Resize           H / J / K / L" "" "" \
    "" \
    "Windows" "" "" \
    "  New Window             c" "c" "new-window -c '#{pane_current_path}'" \
    "  Next Window            n" "n" "next-window" \
    "  Prev Window            p" "p" "previous-window" \
    "  Break to Window        b" "b" "break-pane -d" \
    "  Rename Window          ," "," "command-prompt -I '#{window_name}' 'rename-window %%'" \
    "  Rename Session         \$" "\$" "command-prompt -I '#{session_name}' 'rename-session %%'" \
    "" \
    "Copy Mode" "" "" \
    "  Enter Copy Mode        [" "[" "copy-mode" \
    "  Paste                  ]" "]" "paste-buffer" \
    "  (in copy: v=select  V=line  C-v=rect  y/Enter=copy)" "" "" \
    "" \
    "Layouts" "" "" \
    "  Cycle Layouts      Space" " " "next-layout" \
    "  Even Horizontal    M-1" "" "" \
    "  Even Vertical      M-2" "" "" \
    "  Main Horizontal    M-3" "" "" \
    "  Main Vertical      M-4" "" "" \
    "" \
    "Session" "" "" \
    "  Detach                 d" "d" "detach-client" \
    "  Reload Config          r" "r" "source-file ~/.config/tmux/tmux.conf \; display '  config reloaded'"

# ─── Theme (catppuccin — must be last) ───────────────────────────────────────
set -g @catppuccin_flavor "mocha"
# Support both plugin layouts seen across machines:
# 1) ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
# 2) ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
if-shell '[ -f ~/.config/tmux/plugins/catppuccin/catppuccin.tmux ]' \
    'run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux' \
    'if-shell "[ -f ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux ]" "run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"'
